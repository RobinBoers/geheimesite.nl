<!DOCTYPE html>
<html lang="${LANGUAGE}">
  <head>
    {#include head.html}
    <title>${TITLE}</title>
    <style>
      .h-entry > hgroup time {
        opacity: .6;
      }

      .h-entry > footer .reply-by-email {
        text-align: center;
        margin-top: 4em;
        margin-bottom: 0;
      }

      .h-entry > footer .reply-by-email a {
        color: #ffffff;
        background: #f43f5e;
        border: none;
        padding: .5em 1em;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    {#include nav.html}

    <main>
      <article class="h-entry">
        <hgroup>
          <h1 class="p-name">${TITLE}</h1>
          <p>
            <time class="dt-published" datetime="${DATE}">
              $(date -j -f "%Y-%m-%d" $DATE +'%b %d, %Y')
            </time>
          </p>
        </hgroup>

        <div class="p-summary e-content">
          ${CONTENT}
        </div>

        <footer>
          <p class="reply-by-email">
            <a href="/contact" class="">Reply by email</a>
          </p>
        </footer>
      </article>
    </main>

    <footer>
      {#include footer.html}
    </footer>
  </body>
</html>
