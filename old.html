---
layout: root.njk
---

<style>
html {
  box-sizing: border-box;
}
*, *:before, *:after {
  box-sizing: inherit;
}

html {
  color-scheme: light dark;
  font-family: Inter, Arial, Helvetica, sans-serif;
  font-size: 1.2rem;
  line-height: 1.5;
}

@media (prefers-color-scheme: light) {
  html {
    background: linear-gradient(to right,magenta,orangered),linear-gradient(rgba(0,0,0,.2),rgba(0,0,0,.2));
    background-blend-mode: darken;
    background-attachment: fixed;
  }
}

@media (prefers-color-scheme: dark) {
  html {
    background: linear-gradient(to right,lightskyblue,magenta),linear-gradient(rgba(0,0,0,.2),rgba(0,0,0,.2));
    background-blend-mode: darken;
    background-attachment: fixed;
  }
}

nav {
  display: flex;
  gap: 1.7em;
  margin: 1em;
  justify-content: flex-end;
  
  a {
    font-size: 1.3em;
    text-transform: lowercase;
    color: currentColor;
  }
}

body {
  max-width: 1000px;
  margin: 0 10vw;
}

main {
  background: white;
  padding: 2em;
  background: Canvas;
  box-shadow: 0 25px 50px -12px rgb(0 0 0/.25);
}

a {
  color: currentColor;
  &:hover {opacity: 0.8}
}

footer {
  margin: 2em;
}

header, footer {
  color: white;
  a { color: currentColor }
}

</style>

<header>
  <nav>
    <a href="/">Start</a>
    <a href="/projects">Projects</a>
    <a href="/books">Books</a>
    <a href="//blog.geheimesite.nl">Blog</a>
    <a href="//git.dupunkto.org">Gitz</a>
  </nav>
</header>

<main>
  {{ content | safe }}
</main>
